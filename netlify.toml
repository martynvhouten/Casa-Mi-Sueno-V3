[build]
  command = "npm run build"
  publish = "dist/spa"

[build.environment]
  NODE_VERSION = "20"
  # Secrets scanning whitelist (see docs/DEPLOYMENT_TROUBLESHOOTING.md):
  # VITE_*            – public client API keys, intentionally in the browser bundle
  # ADMIN_EMAIL       – value appears on the public privacy page (contact email)
  # RESEND_API_KEY    – server-only; NOT in build output, but listed defensively
  # RESEND_FROM_EMAIL – public sender address
  SECRETS_SCAN_OMIT_KEYS = "VITE_GOOGLE_API_KEY,VITE_GOOGLE_MAPS_API_KEY,VITE_GOOGLE_SHEET_ID,ADMIN_EMAIL,RESEND_API_KEY,RESEND_FROM_EMAIL"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://sheets.googleapis.com; frame-src https://www.google.com https://maps.google.com;"

# Cache optimization
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

## Trailing slash canonicalization handled by app; avoid host-level redirects to prevent loops

# Static files (sitemap.xml, robots.txt) are served directly; keep SPA fallback last

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[functions]
  directory = "netlify/functions"

# SPA fallback (last)
## No explicit redirects for sitemap/robots to avoid potential loops

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200