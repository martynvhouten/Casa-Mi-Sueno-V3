[build]
  command = "npm run build"
  publish = "dist/spa"

[build.environment]
  NODE_VERSION = "20"
  # Exclude frontend API keys from secrets scanning (these are meant to be public)
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_ANON_KEY,VITE_GOOGLE_API_KEY,VITE_GOOGLE_MAPS_API_KEY"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://www.google-analytics.com https://region1.google-analytics.com https://sheets.googleapis.com; frame-src https://www.google.com https://maps.google.com;"

# Cache optimization
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

## Canonical host + scheme
# Force HTTPS
[[redirects]]
  from = "http://casamisueno.nl/*"
  to = "https://casamisueno.nl/:splat"
  status = 301
  force = true

# Remove www
[[redirects]]
  from = "https://www.casamisueno.nl/*"
  to = "https://casamisueno.nl/:splat"
  status = 301
  force = true

# Remove trailing slash (except root)
[[redirects]]
  from = "/:path/"
  to = "/:path"
  status = 301
  force = true

# Static files (sitemap.xml, robots.txt) are served directly; keep SPA fallback last

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[functions]
  directory = "netlify/functions"

# SPA fallback (last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200